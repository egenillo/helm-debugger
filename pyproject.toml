[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "helm-debugger"
version = "2.0.0"
description = "Find the exact template line that breaks `helm template`"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

[project.optional-dependencies]
values = ["pyyaml"]

[project.scripts]
helm-debugger = "helm_debugger.cli:main"

[tool.setuptools]
packages = ["helm_debugger"]
